
name: Codzienna aktualizacja ubytkow PSE i TGE

on:
  workflow_dispatch:

  schedule:
    - cron: '37 9 * * *'
      timezone: 'Europe/Warsaw'

permissions:
  contents: write

concurrency:
  group: ubytki-codzienna-aktualizacja
  cancel-in-progress: false

jobs:
  aktualizacja:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Zainstaluj Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Zainstaluj biblioteki
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pandas>=2.2,<3" "requests>=2.32,<3" "beautifulsoup4>=4.12,<5"

      - name: Pobierz nowe dane PSE i TGE
        id: pobieranie
        continue-on-error: true
        run: python kody/pobierz_dane.py

      - name: Scal zdarzenia i usun duplikaty
        id: scalanie
        continue-on-error: true
        run: python kody/scal_zdarzenia.py

      - name: Aktualizuj analityke dzienna i historyczna
        id: analityka
        continue-on-error: true
        run: python kody/analityka.py

      - name: Zapisz zmiany w repozytorium
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if ! git diff --cached --quiet; then
            git commit -m "Automatyczna aktualizacja PSE i TGE"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "Brak nowych danych"
          fi

      - name: Sprawdz status aktualizacji
        if: always()
        env:
          POBIERANIE: ${{ steps.pobieranie.outcome }}
          SCALANIE: ${{ steps.scalanie.outcome }}
          ANALITYKA: ${{ steps.analityka.outcome }}
        run: |
          echo "Pobieranie: $POBIERANIE"
          echo "Scalanie: $SCALANIE"
          echo "Analityka: $ANALITYKA"

          if [ "$POBIERANIE" != "success" ] || [ "$SCALANIE" != "success" ] || [ "$ANALITYKA" != "success" ]; then
            echo "Wystapil blad w jednym z etapow"
            exit 1
          fi

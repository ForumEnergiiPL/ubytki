
name: PSE - pobieranie danych

on:
  workflow_dispatch:

  schedule:
    - cron: '17 7 * * *'
      timezone: 'Europe/Warsaw'

permissions:
  contents: write

concurrency:
  group: ubytki-zapis-do-repo
  cancel-in-progress: false

jobs:
  pse:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Biblioteki
        run: |
          python -m pip install 'pandas>=2.2,<3' 'requests>=2.32,<3'

      - name: Pobierz PSE
        id: pobieranie
        continue-on-error: true
        run: python kody/pobierz_pse.py

      - name: Zapisz dane PSE
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add -A -- pse_bilans.csv pse_jednostki.csv pse_remonty.csv pse_status.csv stan_pse.json

          if ! git diff --cached --quiet; then
            git commit -m 'PSE: codzienna aktualizacja'
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Sprawdz wynik PSE
        if: always()
        env:
          WYNIK: ${{ steps.pobieranie.outcome }}
        run: |
          if [ "$WYNIK" != 'success' ]; then
            echo 'Bledy PSE - zachowano dostepne dane'
            exit 1
          fi

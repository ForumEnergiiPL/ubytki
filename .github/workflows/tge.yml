
name: TGE - pobieranie danych

on:
  workflow_dispatch:

  schedule:
    - cron: '17 8 * * *'
      timezone: 'Europe/Warsaw'

permissions:
  contents: write

concurrency:
  group: ubytki-zapis-do-repo
  cancel-in-progress: false

jobs:
  tge:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Biblioteki
        run: |
          python -m pip install 'requests>=2.32,<3' 'beautifulsoup4>=4.12,<5'

      - name: Pobierz TGE
        id: pobieranie
        continue-on-error: true
        run: python kody/pobierz_tge.py

      - name: Zapisz dane TGE
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add -A -- tge_ubytki.csv tge_widoki.csv stan_tge.json

          if [ -d tge_migawki ]; then
            git add -A -- tge_migawki
          fi

          if ! git diff --cached --quiet; then
            git commit -m 'TGE: codzienna aktualizacja'
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Sprawdz wynik TGE
        if: always()
        env:
          WYNIK: ${{ steps.pobieranie.outcome }}
        run: |
          if [ "$WYNIK" != 'success' ]; then
            echo 'TGE niedostepne. PSE i analityka pozostaja niezalezne.'
            exit 1
          fi

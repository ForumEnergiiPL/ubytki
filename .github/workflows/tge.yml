
name: TGE - codzienna aktualizacja

on:
  workflow_dispatch:

  schedule:
    - cron: '17 8 * * *'
      timezone: 'Europe/Warsaw'

permissions:
  contents: write

concurrency:
  group: ubytki-zapis-do-repo
  cancel-in-progress: false

jobs:
  tge:
    runs-on: macos-latest
    timeout-minutes: 15

    steps:

      # 1. Pobierz repozytorium
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      # 2. Python
      - name: Zainstaluj Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 3. Biblioteki
      - name: Zainstaluj biblioteki
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "requests>=2.32,<3" \
            "beautifulsoup4>=4.12,<5" \
            tzdata

      # 4. Diagnostyka DNS
      - name: Sprawdz DNS TGE
        run: |
          python - <<'PY'
          import socket

          try:
              adresy = socket.getaddrinfo(
                  "gpi.tge.pl",
                  443,
                  type=socket.SOCK_STREAM
              )

              for adres in adresy:
                  protokol = (
                      "IPv4"
                      if adres[0] == socket.AF_INET
                      else "IPv6"
                  )

                  print(
                      protokol,
                      adres[4][0]
                  )

          except Exception as e:
              print("BLAD DNS:", e)
          PY

      # 5. Test polaczenia HTTPS przez IPv4
      - name: Sprawdz polaczenie HTTPS TGE
        run: |
          echo "Test TGE przez IPv4"

          curl -4 -sS \
            --connect-timeout 8 \
            --max-time 15 \
            -o /dev/null \
            -w "HTTP: %{http_code}, czas: %{time_total}s\n" \
            https://gpi.tge.pl/pl/zestawienie-ubytkow || true

          echo "Koniec testu polaczenia"

      # 6. Wlasciwe pobieranie danych TGE
      - name: Pobierz dane TGE
        id: pobieranie
        continue-on-error: true
        run: |
          python kody/pobierz_tge.py

      # 7. Zapisz nowe dane do repozytorium
      - name: Zapisz dane TGE
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for file in \
            tge_ubytki.csv \
            tge_widoki.csv \
            stan_tge.json
          do
            if [ -f "$file" ]; then
              git add -- "$file"
            fi
          done

          if [ -d tge_migawki ]; then
            git add -A -- tge_migawki
          fi

          if ! git diff --cached --quiet; then
            git commit -m "TGE: codzienna aktualizacja"

            git pull --rebase origin "${GITHUB_REF_NAME}"

            git push origin "HEAD:${GITHUB_REF_NAME}"

            echo "Zapisano zmiany w repozytorium"
          else
            echo "Brak zmian do zapisania"
          fi

      # 8. Status aktualizacji
      - name: Sprawdz wynik pobierania
        if: always()
        env:
          WYNIK: ${{ steps.pobieranie.outcome }}
        run: |
          echo "Status pobierania: $WYNIK"

          if [ "$WYNIK" != "success" ]; then
            echo "BLAD: Nie udalo sie pobrac TGE"
            exit 1
          fi

          echo "TGE zaktualizowane poprawnie"

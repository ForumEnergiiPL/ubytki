
name: TGE - codzienna aktualizacja

on:
  workflow_dispatch:
  schedule:
    - cron: '17 8 * * *'
      timezone: 'Europe/Warsaw'

permissions:
  contents: write

concurrency:
  group: ubytki-zapis-do-repo
  cancel-in-progress: false

jobs:
  tge:
    runs-on: macos-latest
    timeout-minutes: 15

    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Zainstaluj Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Zainstaluj biblioteki
        run: |
          python -m pip install "requests>=2.32,<3" "beautifulsoup4>=4.12,<5" tzdata

      - name: Pokaz informacje o sieci
        run: |
          python -c "import socket; print('Adresy TGE:', socket.getaddrinfo('gpi.tge.pl', 443, type=socket.SOCK_STREAM))"

      - name: Pobierz TGE
        id: pobieranie
        continue-on-error: true
        run: python kody/pobierz_tge.py

      - name: Zapisz zmiany do repozytorium
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for file in tge_ubytki.csv tge_widoki.csv stan_tge.json; do
            if [ -f "$file" ]; then
              git add -- "$file"
            fi
          done

          if [ -d tge_migawki ]; then
            git add -A -- tge_migawki
          fi

          if ! git diff --cached --quiet; then
            git commit -m "TGE: aktualizacja danych"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "Brak zmian"
          fi

      - name: Sprawdz wynik pobierania
        if: always()
        env:
          WYNIK: ${{ steps.pobieranie.outcome }}
        run: |
          echo "Wynik pobierania: $WYNIK"

          if [ "$WYNIK" != "success" ]; then
            echo "Blad pobierania TGE"
            exit 1
          fi

          echo "TGE zaktualizowane poprawnie"


name: TGE - codzienne pobieranie danych

on:
  workflow_dispatch:

  schedule:
    - cron: '17 8 * * *'
      timezone: 'Europe/Warsaw'

permissions:
  contents: write

concurrency:
  group: ubytki-zapis-do-repo
  cancel-in-progress: false

jobs:
  tge:
    runs-on: windows-latest
    timeout-minutes: 15

    defaults:
      run:
        shell: bash

    env:
      PYTHONIOENCODING: utf-8

    steps:

      # 1. Pobierz repozytorium
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      # 2. Zainstaluj Python
      - name: Zainstaluj Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 3. Zainstaluj biblioteki
      - name: Zainstaluj biblioteki
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "requests>=2.32,<3" \
            "beautifulsoup4>=4.12,<5" \
            "tzdata"

      # 4. Pobierz dane z TGE
      - name: Pobierz TGE
        id: pobieranie
        continue-on-error: true
        run: |
          echo "Rozpoczynam pobieranie TGE..."
          python kody/pobierz_tge.py

      # 5. Zapisz dane w repozytorium
      - name: Zapisz dane TGE
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A -- \
            tge_ubytki.csv \
            tge_widoki.csv \
            stan_tge.json

          if [ -d "tge_migawki" ]; then
            git add -A -- tge_migawki
          fi

          if ! git diff --cached --quiet; then
            git commit -m "TGE: codzienna aktualizacja"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
            echo "Zapisano zmiany w repozytorium"
          else
            echo "Brak nowych danych TGE"
          fi

      # 6. Sprawdz status pobierania
      - name: Sprawdz wynik
        if: always()
        env:
          WYNIK: ${{ steps.pobieranie.outcome }}
        run: |
          echo "Status pobierania TGE: $WYNIK"

          if [ "$WYNIK" != "success" ]; then
            echo "TGE nie zostalo poprawnie pobrane."
            echo "Pozostale workflowy dzialaja niezaleznie."
            exit 1
          fi

          echo "Aktualizacja TGE zakonczona."


name: TGE - 3 proby z roznych runnerow

on:
  workflow_dispatch:

  schedule:
    - cron: '17 8 * * *'
      timezone: 'Europe/Warsaw'

permissions:
  contents: write

concurrency:
  group: ubytki-zapis-do-repo
  cancel-in-progress: false

jobs:

  # ============================================
  # PROBA 1 - UBUNTU
  # ============================================

  linux:
    name: Proba 1 - Ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 12

    outputs:
      ok: ${{ steps.zapis.outputs.ok }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Biblioteki
        run: |
          python -m pip install \
            'requests>=2.32,<3' \
            'beautifulsoup4>=4.12,<5' \
            tzdata

      - name: Pobierz TGE
        id: pobieranie
        env:
          TGE_URL: https://gpi.tge.pl/pl/zestawienie-ubytkow
        run: |
          if python kody/pobierz_tge.py; then
            echo 'ok=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ok=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Zapisz CSV po sukcesie
        id: zapis
        if: steps.pobieranie.outputs.ok == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          for f in tge_ubytki.csv tge_widoki.csv stan_tge.json; do
            if [ -f "$f" ]; then
              git add -- "$f"
            fi
          done

          if [ -d tge_migawki ]; then
            git add -A -- tge_migawki
          fi

          if ! git diff --cached --quiet; then
            git commit -m 'TGE: aktualizacja (Ubuntu)'
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

          echo 'ok=true' >> "$GITHUB_OUTPUT"

  # ============================================
  # PROBA 2 - MACOS
  # ============================================

  macos:
    name: Proba 2 - macOS
    needs: linux

    if: ${{ always() && needs.linux.outputs.ok != 'true' }}

    runs-on: macos-latest
    timeout-minutes: 12

    outputs:
      ok: ${{ steps.zapis.outputs.ok }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Biblioteki
        run: |
          python -m pip install \
            'requests>=2.32,<3' \
            'beautifulsoup4>=4.12,<5' \
            tzdata

      - name: Krotka przerwa przed druga proba
        run: sleep 20

      - name: Pobierz TGE
        id: pobieranie
        env:
          TGE_URL: https://gpi.tge.pl/zestawienie-ubytkow
        run: |
          if python kody/pobierz_tge.py; then
            echo 'ok=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ok=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Zapisz CSV po sukcesie
        id: zapis
        if: steps.pobieranie.outputs.ok == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          for f in tge_ubytki.csv tge_widoki.csv stan_tge.json; do
            if [ -f "$f" ]; then
              git add -- "$f"
            fi
          done

          if [ -d tge_migawki ]; then
            git add -A -- tge_migawki
          fi

          if ! git diff --cached --quiet; then
            git commit -m 'TGE: aktualizacja (macOS)'
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

          echo 'ok=true' >> "$GITHUB_OUTPUT"

  # ============================================
  # PROBA 3 - WINDOWS
  # ============================================

  windows:
    name: Proba 3 - Windows

    needs: [linux, macos]

    if: ${{ always() && needs.linux.outputs.ok != 'true' && needs.macos.outputs.ok != 'true' }}

    runs-on: windows-latest
    timeout-minutes: 12

    defaults:
      run:
        shell: bash

    outputs:
      ok: ${{ steps.zapis.outputs.ok }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Biblioteki
        run: |
          python -m pip install \
            'requests>=2.32,<3' \
            'beautifulsoup4>=4.12,<5' \
            tzdata

      - name: Krotka przerwa przed trzecia proba
        run: sleep 20

      - name: Pobierz TGE
        id: pobieranie
        env:
          TGE_URL: https://gpi.tge.pl/pl/zestawienie-ubytkow
        run: |
          if python kody/pobierz_tge.py; then
            echo 'ok=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ok=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Zapisz dane lub status bledu
        id: zapis
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          if [ -f stan_tge.json ]; then
            git add -- stan_tge.json
          fi

          if [ '${{ steps.pobieranie.outputs.ok }}' = 'true' ]; then

            for f in tge_ubytki.csv tge_widoki.csv; do
              if [ -f "$f" ]; then
                git add -- "$f"
              fi
            done

            if [ -d tge_migawki ]; then
              git add -A -- tge_migawki
            fi

          fi

          if ! git diff --cached --quiet; then
            git commit -m 'TGE: wynik proby (Windows)'
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

          if [ '${{ steps.pobieranie.outputs.ok }}' = 'true' ]; then
            echo 'ok=true' >> "$GITHUB_OUTPUT"
          fi

  # ============================================
  # PODSUMOWANIE
  # ============================================

  wynik:
    name: Wynik koncowy

    needs: [linux, macos, windows]
    if: ${{ always() }}

    runs-on: ubuntu-latest

    steps:
      - name: Podsumuj 3 proby
        env:
          UBUNTU: ${{ needs.linux.outputs.ok }}
          MACOS: ${{ needs.macos.outputs.ok }}
          WINDOWS: ${{ needs.windows.outputs.ok }}

        run: |
          echo "Ubuntu: $UBUNTU"
          echo "macOS: $MACOS"
          echo "Windows: $WINDOWS"

          if [ "$UBUNTU" = 'true' ] || \
             [ "$MACOS" = 'true' ] || \
             [ "$WINDOWS" = 'true' ]; then

            echo 'TGE pobrano i zapisano.'

          else

            echo 'TGE nie odpowiada z zadnego z trzech runnerow.'
            exit 1

          fi
